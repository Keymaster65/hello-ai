spring:
  application:
    name: recipes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USERNAME:recipes}
    password: ${DB_PASSWORD:recipes}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES

springdoc:
  api-docs:
    # Machine-readable contract (OpenAPI 3.1, JSON) – also served as YAML under /v3/api-docs.yaml
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

server:
  port: 80
