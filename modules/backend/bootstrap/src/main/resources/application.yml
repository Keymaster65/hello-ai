spring:
  application:
    name: recipes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USERNAME:recipes}
    password: ${DB_PASSWORD:recipes}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES
  mvc:
    # Auch die Ausnahmen des Frameworks (405, 415, 406 …) antworten als RFC 9457 problem+json,
    # nicht mehr als Standardseite (docs/prompt/api.adoc). Die vier eigenen Fälle behält der
    # GlobalExceptionHandler – er ist höher priorisiert als Springs Handler.
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    # Machine-readable contract (OpenAPI 3.1, JSON) – also served as YAML under /v3/api-docs.yaml
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

server:
  port: 80
  servlet:
    # Basis-URL der Anwendung: SPA, API und Swagger UI liegen unter /recipes (docs/prompt/api.adoc).
    context-path: /recipes

recipes:
  security-txt:
    # Meldeweg für Schwachstellen nach RFC 9116, ausgeliefert unter /.well-known/security.txt –
    # am Ursprung, also *neben* dem Context-Path (docs/prompt/security-backend.adoc).
    contact: ${SECURITY_TXT_CONTACT:https://github.com/Keymaster65/hello-ai/issues}
    # RFC 3339; RFC 9116 empfiehlt weniger als ein Jahr in der Zukunft. SecurityTxtConfigurationTest
    # bricht den Build, sobald das Datum abgelaufen oder zu weit entfernt ist.
    expires: ${SECURITY_TXT_EXPIRES:2027-08-01T00:00:00Z}
    preferred-languages: de, en
