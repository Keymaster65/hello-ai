spring:
  application:
    name: recipe-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USERNAME:recipes}
    password: ${DB_PASSWORD:recipes}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jooq:
    sql-dialect: POSTGRES

server:
  port: 80
